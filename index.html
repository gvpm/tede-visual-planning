<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor Final</title>

  <style>
    body {
      font-family: Arial;
      background: #eef2f7;
      margin: 0;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 15px;
    }

    .panel {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    input,
    select,
    button {
      padding: 8px;
      font-size: 14px;
      max-width: 100%;
    }

    /* MENU */
    .topbar {
      background: #333;
      color: white;
      padding: 10px;
    }

    /* VIEWS */
    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    /* PICKERS */
    .bg-option,
    .icon-option {
      margin: 5px;
      cursor: pointer;
      display: inline-block;
      border: 2px solid transparent;
    }

    .bg-selected,
    .icon-selected {
      border: 2px solid black;
    }

    .bg-preview {
      width: 70px;
    }

    /* ÍCONE */
    .icon-bg {
      width: 80px;
      height: 80px;
      position: relative;
      margin-bottom: 8px;
    }

    .icon-bg img.bg {
      width: 100%;
      height: 100%;
    }

    .icon-bg img.icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
    }

    /* 🔥 BLOQUEIA DRAG NATIVO DAS IMAGENS */
    .icon-bg img {
      pointer-events: none;
      user-drag: none;
      -webkit-user-drag: none;
    }

    /* LISTA */
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      border-top: 1px solid #ddd;
      padding-top: 10px;
    }

    .icon-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 110px;
      text-align: center;
    }

    .icon-text {
      font-size: 12px;
      word-break: break-word;
      text-align: center;
      max-width: 110px;
      line-height: 1.2;
    }

    .raia-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    textarea {
      width: 100%;
      height: 120px;
    }

    /* RAIAS */
    .raia {
      border: 2px dashed #aaa;
      margin: 10px 0;
      height: 200px;
      position: relative;
      background: #f9f9f9;
    }

    .raia-title {
      background: #444;
      /* cinza levemente mais claro que #333 */
      color: white;
      padding: 5px;
      display: flex;
      justify-content: space-between;
    }

    .raia-item {
      position: absolute;
      cursor: grab;
      /* 🔥 melhor UX */
      z-index: 99999;
    }

    .raia-item:active {
      cursor: grabbing;
    }

    /* MOBILE */
    @media (max-width:768px) {
      .icon-card {
        width: 90px;
      }

      .icon-bg {
        width: 70px;
        height: 70px;
      }

      .icon-bg img.icon {
        width: 30px;
      }
    }
  </style>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>

<body>

  <div class="topbar">
    Modo:
    <select onchange="trocarModo(this.value)">
      <option value="icones">Ícones</option>
      <option value="raias">Raias</option>
    </select>
  </div>

  <!-- ================= ICONES ================= -->
  <div id="view-icones" class="view active">
    <div style="padding:10px; display:flex; gap:10px;">
      <button onclick="exportar()">Exportar</button>
      <button onclick="abrirImportIcons()">Importar</button>
    </div>

    <div class="container">

      <div class="panel">
        <h3>Novo Ícone</h3>

        <input id="texto" placeholder="Texto">
        <select id="tipo"></select>
        <select id="subtipo"></select>

        <h4>Background</h4>
        <div id="backgrounds"></div>

        <h4>Ícone</h4>
        <div id="icones"></div>

        <button onclick="criarIcone()">Criar</button>
      </div>

      <div class="panel">
        <h3>Tipos</h3>
        <input id="novoTipo"><button onclick="addTipo()">+</button>
        <div id="listaTipos"></div>
      </div>

      <div class="panel">
        <h3>Subtipos</h3>
        <input id="novoSubtipo">
        <select id="subtipoTipo"></select>
        <button onclick="addSubtipo()">+</button>
        <div id="listaSubtipos"></div>
      </div>

    </div>

    <h3 style="padding-left:15px;">Ícones</h3>
    <div id="preview" style="padding:15px;"></div>



  </div>

  <!-- ================= RAIAS ================= -->
  <div id="view-raias" class="view" style="padding:10px;">

    <button onclick="abrirPicker()">Adicionar Ícone</button>
    <button onclick="addRaia()">+ Raia</button>
    <button onclick="exportarRaias()">Exportar</button>

    <button onclick="abrirImportRaias()">Importar</button>
    <button onclick="exportarImagem()">Exportar Imagem</button>

    <div id="raiasContainer"></div>
  </div>

  </div>

  <div id="picker"
    style="display:none;position:fixed;bottom:0;left:0;right:0;background:white;padding:10px;border-top:2px solid #ccc;max-height:50vh;overflow:auto;">
  </div>

  <script>

    /* ================= DB ================= */
    let db = {
      tipos: [{ id: "t1", nome: "Recursos" }],
      subtipos: [{ id: "s1", nome: "Interativo", tipoId: "t1" }],
      icones: []
    };

    let selecionado = {
      background: "ca.png",
      imagem: "1.png"
    };

    let iconesRaias = [];
    const backgroundsDisponiveis = [
      "ca.png", "cl.png", "cr.png", "cv.png",
      "qa.png", "ql.png", "qr.png", "qv.png",
      "ta.png", "tl.png", "tr.png", "tv.png"
    ];

    const imagensDisponiveis = ["1.png", "2.png", "3.png", "4.png", "5.png", "6.png", "7.png", "8.png", "9.png", "10.png", "11.png", "12.png"];

    /* ================= IDS ================= */
    function gerarId(prefix, lista) {
      const nums = lista.map(i => parseInt(i.id.replace(prefix, ''))).filter(n => !isNaN(n));
      return prefix + (nums.length ? Math.max(...nums) + 1 : 1);
    }

    /* ================= MODOS ================= */
    function trocarModo(m) {
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      document.getElementById("view-" + m).classList.add("active");

      picker.style.display = "none";

      // 🔥 NOVO
      if (m !== "raias") {
        iconesRaias.forEach(el => el.style.display = "none");
      } else {
        iconesRaias.forEach(el => el.style.display = "block");
      }
    }

    /* ================= PICKERS ================= */
    function renderPickers() {
      backgrounds.innerHTML = "";
      icones.innerHTML = "";

      backgroundsDisponiveis.forEach(bg => {
        let el = document.createElement("img");
        el.src = "resources/backgrounds/" + bg;
        el.className = "bg-option bg-preview";
        if (bg === selecionado.background) el.classList.add("bg-selected");
        el.onclick = () => { selecionado.background = bg; renderPickers(); }
        backgrounds.appendChild(el);
      });

      imagensDisponiveis.forEach(img => {
        let el = document.createElement("img");
        el.src = "resources/icons/" + img;
        el.className = "icon-option";
        if (img === selecionado.imagem) el.classList.add("icon-selected");
        el.onclick = () => { selecionado.imagem = img; renderPickers(); }
        icones.appendChild(el);
      });
    }

    /* ================= ICONES ================= */
    function criarIcone() {
      if (!texto.value || !tipo.value || !subtipo.value) return;

      db.icones.push({
        id: gerarId("i", db.icones),
        texto: texto.value,
        tipoId: tipo.value,
        subtipoId: subtipo.value,
        background: selecionado.background,
        imagem: selecionado.imagem
      });

      refreshAll();
    }

    function renderIcons() {
      preview.innerHTML = "";

      db.tipos.forEach(t => {
        const tipoDiv = document.createElement("div");
        tipoDiv.innerHTML = `<h2>${t.nome}</h2>`;

        db.subtipos.filter(s => s.tipoId === t.id).forEach(s => {

          const subDiv = document.createElement("div");

          // 🔥 AQUI ESTÁ A CORREÇÃO
          const titulo = document.createElement("h4");
          titulo.innerText = s.nome;

          const row = document.createElement("div");
          row.className = "row";

          db.icones.filter(i => i.subtipoId === s.id).forEach(i => {
            const card = document.createElement("div");
            card.className = "icon-card";

            card.innerHTML = `
          <div class="icon-bg">
            <img class="bg" src="resources/backgrounds/${i.background}">
            <img class="icon" src="resources/icons/${i.imagem}">
          </div>
          <div class="icon-text">${i.texto}</div>
          <button onclick="deletarIcone('${i.id}')">🗑️</button>
        `;

            row.appendChild(card);
          });

          subDiv.appendChild(titulo); // 👈 ESSENCIAL
          subDiv.appendChild(row);

          tipoDiv.appendChild(subDiv);
        });

        preview.appendChild(tipoDiv);
      });
    }

    function deletarIcone(id) {
      db.icones = db.icones.filter(i => i.id !== id);
      refreshAll();
    }

    /* ================= TIPOS ================= */
    function addTipo() {
      if (!novoTipo.value) return;
      db.tipos.push({ id: gerarId("t", db.tipos), nome: novoTipo.value });
      refreshAll();
    }

    function addSubtipo() {
      if (!novoSubtipo.value) return;
      db.subtipos.push({ id: gerarId("s", db.subtipos), nome: novoSubtipo.value, tipoId: subtipoTipo.value });
      refreshAll();
    }

    function renderListas() {
      listaTipos.innerHTML = "";
      db.tipos.forEach(t => {
        listaTipos.innerHTML += `
    <div class="list-item">${t.nome}
    <button onclick="deletarTipo('${t.id}')">🗑️</button></div>`;
      });

      listaSubtipos.innerHTML = "";
      db.subtipos.forEach(s => {
        listaSubtipos.innerHTML += `
    <div class="list-item">${s.nome}
    <button onclick="deletarSubtipo('${s.id}')">🗑️</button></div>`;
      });
    }

    function deletarTipo(id) {
      db.tipos = db.tipos.filter(t => t.id !== id);
      db.subtipos = db.subtipos.filter(s => s.tipoId !== id);
      db.icones = db.icones.filter(i => i.tipoId !== id);
      refreshAll();
    }

    function deletarSubtipo(id) {
      db.subtipos = db.subtipos.filter(s => s.id !== id);
      db.icones = db.icones.filter(i => i.subtipoId !== id);
      refreshAll();
    }

    function renderTipos() {
      tipo.innerHTML = "";
      subtipoTipo.innerHTML = "";
      db.tipos.forEach(t => {
        tipo.innerHTML += `<option value="${t.id}">${t.nome}</option>`;
        subtipoTipo.innerHTML += `<option value="${t.id}">${t.nome}</option>`;
      });
    }

    function renderSubtipos() {
      subtipo.innerHTML = "";
      db.subtipos.filter(s => s.tipoId === tipo.value)
        .forEach(s => {
          subtipo.innerHTML += `<option value="${s.id}">${s.nome}</option>`;
        });
    }

    tipo.addEventListener("change", renderSubtipos);

    /* ================= RAIAS ================= */
    let raias = [
      { id: "r1", nome: "Recursos" },
      { id: "r2", nome: "Atividades" },
      { id: "r3", nome: "Ação do Professor" }
    ];

    function renderRaias() {
      const c = document.getElementById("raiasContainer");
      c.innerHTML = "";

      raias.forEach(r => {
        const d = document.createElement("div");
        d.className = "raia";
        d.id = r.id;

        d.innerHTML = `
      <div class="raia-title">
        <input value="${r.nome}" onchange="editarRaia('${r.id}',this.value)">
        <button onclick="deletarRaia('${r.id}')">🗑️</button>
      </div>
    `;

        c.appendChild(d);
      });
    }

    function addRaia() {
      raias.push({ id: "r" + (raias.length + 1), nome: "Nova Raia" });
      renderRaias();
    }

    function deletarRaia(id) {
      raias = raias.filter(r => r.id !== id);
      renderRaias();
    }

    function editarRaia(id, n) {
      const r = raias.find(r => r.id === id);
      if (r) r.nome = n;
    }

    /* ================= PICKER BONITO ================= */
    function abrirPicker() {

      // 🔥 TOGGLE
      if (picker.style.display === "block") {
        picker.style.display = "none";

        // 🔥 remove estado do histórico
        if (history.state?.pickerOpen) {
          history.back();
        }

        return;
      }

      picker.style.display = "block";

      // 🔥 adiciona estado no histórico
      history.pushState({ pickerOpen: true }, "");

      picker.style.display = "block";
      picker.innerHTML = "";

      db.tipos.forEach(t => {
        const tipoDiv = document.createElement("div");
        tipoDiv.innerHTML = `<h4>${t.nome}</h4>`;

        db.subtipos.filter(s => s.tipoId === t.id).forEach(s => {

          const subDiv = document.createElement("div");
          subDiv.innerHTML = `<strong>${s.nome}</strong>`;

          const row = document.createElement("div");
          row.className = "row";

          db.icones.filter(i => i.subtipoId === s.id).forEach(i => {
            const card = document.createElement("div");
            card.className = "icon-card";

            card.innerHTML = `
          <div class="icon-bg">
            <img class="bg" src="resources/backgrounds/${i.background}">
            <img class="icon" src="resources/icons/${i.imagem}">
          </div>
          <div class="icon-text">${i.texto}</div>
        `;

            card.onclick = () => addIconToRaia(i);

            row.appendChild(card);
          });

          subDiv.appendChild(row);
          tipoDiv.appendChild(subDiv);
        });

        picker.appendChild(tipoDiv);
      });
    }

    /* ================= DRAG FIX ================= */
    function addIconToRaia(icon) {

      const el = document.createElement("div");
      el.className = "raia-item";
      el.dataset.id = icon.id;


      el.innerHTML = `
  <div class="raia-icon">
    <div class="icon-bg">
      <img class="bg" src="resources/backgrounds/${icon.background}">
      <img class="icon" src="resources/icons/${icon.imagem}">
    </div>
    <div class="icon-text">${icon.texto}</div>
  </div>
`;
      document.getElementById("view-raias").appendChild(el);
      iconesRaias.push(el);

      el.style.position = "absolute";
      el.style.left = "100px";
      el.style.top = "100px";

      makeDraggable(el);


    }
    function makeDraggable(el) {
      let lastTap = 0;
      let offsetX = 0;
      let offsetY = 0;
      let dragging = false;
      let pointerDown = false;

      el.style.touchAction = "none";
      el.addEventListener("pointerdown", (e) => {

        const now = Date.now();

        if (now - lastTap < 300) {
          el.remove();
          iconesRaias = iconesRaias.filter(i => i !== el);
          return;
        }

        lastTap = now;

        pointerDown = true;

        const rect = el.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;

        el.setPointerCapture(e.pointerId);
      });

      el.addEventListener("pointermove", (e) => {

        // 🔥 SÓ COMEÇA DRAG SE ESTIVER PRESSIONADO
        if (!pointerDown) return;

        dragging = true;

        let x = e.clientX + window.scrollX - offsetX;
        let y = e.clientY + window.scrollY - offsetY;

        el.style.left = x + "px";
        el.style.top = y + "px";
      });

      el.addEventListener("pointerup", (e) => {
        pointerDown = false;
        dragging = false;

        try {
          el.releasePointerCapture(e.pointerId);
        } catch { }
      });

      el.addEventListener("pointercancel", () => {
        pointerDown = false;
        dragging = false;
      });
    }

    /* ================= JSON ================= */
    function exportar() {
      jsonExportIcons.value = JSON.stringify(db, null, 2);
      modalExportIcons.style.display = "block";
    }

    function abrirImportIcons() {
      modalImportIcons.style.display = "block";
    }

    /* ================= INIT ================= */
    function refreshAll() {
      renderTipos();
      renderSubtipos();
      renderListas();
      renderPickers();
      renderIcons();
    }
    async function carregarJSONInicial() {
      try {
        const res = await fetch("resources/icons.json");
        const data = await res.json();

        // 🔥 substitui o banco inteiro
        db = data;

        refreshAll();
      } catch (e) {
        console.warn("Não carregou icons.json, usando padrão");
        refreshAll();
      }
    }

    carregarJSONInicial();
    renderRaias();

    document.addEventListener("pointerdown", (e) => {
      const pickerEl = document.getElementById("picker");

      // se não está aberto, ignora
      if (pickerEl.style.display !== "block") return;

      // se clicou dentro do picker → não fecha
      if (pickerEl.contains(e.target)) return;

      // se clicou no botão abrir → não fecha
      if (e.target.closest("button")?.innerText === "Adicionar Ícone") return;

      // qualquer outro clique → fecha
      pickerEl.style.display = "none";
    });


    /* ================= EXPORT / IMPORT RAIAS ================= */

    function exportarRaias() {

      const layout = {
        raias: raias,
        itens: iconesRaias.map(el => ({
          iconId: el.dataset.id,
          left: el.style.left,
          top: el.style.top
        }))
      };

      jsonExportRaias.value = JSON.stringify(layout, null, 2);
      modalExport.style.display = "block";
    }

    function fecharExport() {
      modalExport.style.display = "none";
    }

    function abrirImportRaias() {
      modalImport.style.display = "block";
    }

    function fecharImport() {
      modalImport.style.display = "none";
    }

    function importarRaias() {
      try {
        const data = JSON.parse(jsonImportRaias.value);

        // 🔥 valida se todos os ícones existem
        for (let item of data.itens) {
          const existe = db.icones.find(i => i.id === item.iconId);
          if (!existe) {
            alert("Erro: existe ícone no layout que não está carregado.");
            return;
          }
        }

        // limpa ícones atuais
        iconesRaias.forEach(el => el.remove());
        iconesRaias = [];

        // aplica raias
        raias = data.raias;
        renderRaias();

        // recria ícones
        data.itens.forEach(item => {

          const icon = db.icones.find(i => i.id === item.iconId);

          const el = document.createElement("div");
          el.className = "raia-item";
          el.dataset.id = icon.id;

          el.innerHTML = `
        <div class="raia-icon">
          <div class="icon-bg">
            <img class="bg" src="resources/backgrounds/${icon.background}">
            <img class="icon" src="resources/icons/${icon.imagem}">
          </div>
          <div class="icon-text">${icon.texto}</div>
        </div>
      `;

          el.style.left = item.left;
          el.style.top = item.top;

          document.getElementById("view-raias").appendChild(el);
          iconesRaias.push(el);

          makeDraggable(el);
        });

        fecharImport();

      } catch (e) {
        alert("JSON inválido");
      }
    }

    function baixarArquivo(nome, conteudo) {
      const blob = new Blob([conteudo], { type: "application/json" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = nome;
      a.click();

      URL.revokeObjectURL(url);
    }



    function fecharExportIcons() {
      modalExportIcons.style.display = "none";
    }

    function fecharImportIcons() {
      modalImportIcons.style.display = "none";
    }

    function copiarIcons() {
      navigator.clipboard.writeText(jsonExportIcons.value);
    }

    function baixarIcons() {
      baixarArquivo("icons.json", jsonExportIcons.value);
    }

    function importarIconsModal() {
      try {
        db = JSON.parse(jsonImportIcons.value);
        refreshAll();
        fecharImportIcons();
      } catch {
        alert("JSON inválido");
      }
    }

    function uploadIcons(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        jsonImportIcons.value = reader.result;
      };
      reader.readAsText(file);
    }


    function copiarRaias() {
      navigator.clipboard.writeText(jsonExportRaias.value);
    }

    function baixarRaias() {
      baixarArquivo("raias.json", jsonExportRaias.value);
    }

    function uploadRaias(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        jsonImportRaias.value = reader.result;
      };
      reader.readAsText(file);
    }

    window.addEventListener("popstate", (e) => {

      // se o menu estiver aberto → fecha ao invés de sair da página
      if (picker.style.display === "block") {
        picker.style.display = "none";
        return;
      }

    });

    function exportarImagem() {

      const area = document.getElementById("view-raias");

      // 🔥 garante que picker não aparece
      const pickerEl = document.getElementById("picker");
      const oldDisplay = pickerEl.style.display;
      pickerEl.style.display = "none";

      html2canvas(area, {
        backgroundColor: "#ffffff",
        scale: 2,
        useCORS: true // 🔥 IMPORTANTE
      }).then(canvas => {

        const link = document.createElement("a");
        link.download = "raias.png";
        link.href = canvas.toDataURL("image/png");
        link.click();

        // restaura picker
        pickerEl.style.display = oldDisplay;

      });
    }
  </script>
  <div id="modalExport" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999999;">
    <div style="background:white;padding:15px;margin:50px auto;max-width:500px;">
      <h3>Exportar Layout</h3>
      <textarea id="jsonExportRaias"></textarea>

      <br><br>

      <button onclick="copiarRaias()">Copiar</button>
      <button onclick="baixarRaias()">Baixar</button>

      <button onclick="fecharExport()">Fechar</button>
    </div>
  </div>

  <div id="modalImport" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999999;">
    <div style="background:white;padding:15px;margin:50px auto;max-width:500px;">
      <h3>Importar Layout</h3>
      <textarea id="jsonImportRaias"></textarea>

      <br><br>
